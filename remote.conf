# ─── Remote marker ────────────────────────────────────────
# Sourced by tmux.conf only when this tmux server was started inside an SSH
# session — that is, when it is the *inner* tmux someone reaches from another
# machine. It announces itself through the terminal title; the outer tmux sees
# that title on its pane and switches its own prefix off (scripts/remote-mode.sh),
# so C-a and every binding act here instead of on the machine you came from.
set -g set-titles on
set -g set-titles-string 'tmux-remote:#{host_short}'

# tmux does not restore the title when a client leaves, so do it by hand — the
# title changing back is what returns the keyboard to the outer tmux.
set-hook -g client-detached "run-shell \"~/.config/tmux/scripts/remote-mode.sh title-reset '#{hook_client}'\""
