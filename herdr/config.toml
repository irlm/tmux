# Herdr configuration template for irlm/workbench.
#
# scripts/herdr-config.sh renders this file plus the popup bindings generated
# from actions.tsv into ~/.config/herdr/config.toml, then appends your own
# ~/.config/tmux-user/herdr.toml. Edit that file for personal settings; edits
# to the rendered file are overwritten on the next update.
#
# The keys mirror tmux.conf: C-a prefix, hjkl panes, | and - splits, [ for
# copy mode, 1-9 for tabs, Backspace for the previous workspace. Every
# conflict with a Herdr default was moved to a ctrl chord under the prefix.

# Herdr writes this itself after its first-run screen; carrying it here keeps
# the rendered file untouched (and the first line stays our marker).
onboarding = false

# The theme follows C-a C-t: the base Herdr theme plus the chosen palette's
# text and status colours, so the tab bar reads as well as the tmux status
# line does (Herdr's own secondary text token is too dim for that).
@@THEME@@

[terminal]
# Popups and new panes follow the pane they were opened from, like tmux's
# split-window -c "#{pane_current_path}".
new_cwd = "follow"
# Images drawn with the Kitty graphics protocol pass through to Ghostty,
# kitty and WezTerm. Costs nothing until a program draws one.
kitty_graphics = true

[keys]
prefix = "ctrl+a"

# ─── Panes ───────────────────────────────────────────────
# The arrows work under the prefix too, as they do in tmux.
focus_pane_left = ["prefix+h", "prefix+left"]
focus_pane_down = ["prefix+j", "prefix+down"]
focus_pane_up = ["prefix+k", "prefix+up"]
focus_pane_right = ["prefix+l", "prefix+right"]
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
resize_mode = "prefix+shift+r"
swap_pane_left = "prefix+{"
swap_pane_right = "prefix+}"
swap_pane_up = ""
swap_pane_down = ""
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
zoom = "prefix+z"
close_pane = "prefix+x"
last_pane = "prefix+;"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
rename_pane = ""            # C-a P is the SSH split popup; rename from the pane menu
copy_mode = "prefix+["
edit_scrollback = "prefix+ctrl+e"

# ─── Tabs (tmux windows) ─────────────────────────────────
new_tab = "prefix+c"
rename_tab = "prefix+,"
close_tab = "prefix+shift+x"
previous_tab = "prefix+p"
next_tab = "prefix+]"       # C-a n is the notes popup, as in tmux
switch_tab = "prefix+1..9"
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"

# ─── Workspaces (tmux sessions) ──────────────────────────
new_workspace = "prefix+shift+n"
# Worktrees go through the C-a C-g popup (scripts/worktree.sh), the same
# key as under tmux; Herdr's own prompts stay reachable from the sidebar.
new_worktree = ""
open_worktree = ""
rename_workspace = "prefix+."
close_workspace = "prefix+shift+q"
workspace_picker = "prefix+shift+s"
goto = "prefix+shift+w"
previous_workspace = "prefix+backspace"
toggle_sidebar = "prefix+b"

# ─── Agents ──────────────────────────────────────────────
next_agent = "prefix+ctrl+n"
previous_agent = "prefix+ctrl+p"
open_notification_target = "prefix+ctrl+o"

# ─── Herdr itself ────────────────────────────────────────
help = "prefix+f1"          # C-a ? is the workbench reference; F1 lists live Herdr bindings
settings = "prefix+ctrl+s"
reload_config = "prefix+r"
detach = "prefix+q"

# ─── Editor-aware navigation (no prefix) ─────────────────
# ctrl+h/j/k/l move between panes, and inside Neovim between its windows,
# exactly like vim-tmux-navigator under tmux. One short script per press.
# ctrl+alt+h/j/k/l do the same: the chords Herdr documents as reaching it
# from every terminal, in case the plain ctrl ones are read as backspace or
# enter. The last press is described in ~/.cache/tmux/navigate-last.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "bash @@SCRIPTS@@/herdr-navigate.sh left"
description = "focus pane or editor window to the left"

[[keys.command]]
key = "ctrl+alt+h"
type = "shell"
command = "bash @@SCRIPTS@@/herdr-navigate.sh left"
description = "focus pane or editor window to the left"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "bash @@SCRIPTS@@/herdr-navigate.sh down"
description = "focus pane or editor window below"

[[keys.command]]
key = "ctrl+alt+j"
type = "shell"
command = "bash @@SCRIPTS@@/herdr-navigate.sh down"
description = "focus pane or editor window below"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "bash @@SCRIPTS@@/herdr-navigate.sh up"
description = "focus pane or editor window above"

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
command = "bash @@SCRIPTS@@/herdr-navigate.sh up"
description = "focus pane or editor window above"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "bash @@SCRIPTS@@/herdr-navigate.sh right"
description = "focus pane or editor window to the right"

[[keys.command]]
key = "ctrl+alt+l"
type = "shell"
command = "bash @@SCRIPTS@@/herdr-navigate.sh right"
description = "focus pane or editor window to the right"

[ui]
status_indicators = "symbols"
# "spaces" keeps each agent under its workspace, so the list is the map of
# where you were working; herdr_agent_sort=priority in options.env queues
# them by what needs you instead: blocked first, then done, then working.
agent_panel_sort = "@@AGENT_SORT@@"
# A split pane running an agent says so in its border.
show_agent_labels_on_pane_borders = true
confirm_close = true
prompt_new_tab_name = false
window_title = "{hostname}: {workspace}"
# The right edge of the tab bar carries the same cached hardware readings the
# tmux status bar shows. The script samples at most once every five seconds
# and reuses the result, so this costs one short process per interval.
# With herdr_status_colors=on in options.env (a Herdr whose entries accept a
# color) each reading becomes its own entry in the palette's colours.
tab_bar_right = [
  { type = "zoom" },
@@STATUS_ENTRIES@@
  { type = "datetime", format = "%a %d %b %H:%M" },
]
tab_bar_right_separator = " | "

# Agent rows: Claude Code and Codex put the task in the terminal title, so a
# row shows what the agent is on, not only that it is working. Beside the
# agent's name, the context its next turn re-reads ("ctx 240k", reported by
# scripts/agent-events.sh from the transcript); past ctx_warn_k it is painted,
# the sign that the next task belongs in a new session.
[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "tab"], ["agent", "$ctx", { token = "$ctx_big", fg = "#ebcb8b", bold = true }]]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"], ["agent", "$ctx", { token = "$ctx_big", fg = "#ebcb8b", bold = true }]]
codex = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

# Workspace rows: branch, ahead/behind, and the size of the uncommitted work
# ($changes, "3 files +40 -12") that scripts/agent-events.sh reports whenever
# an agent in that workspace changes state.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$changes"]]

[ui.toast]
# Desktop notification through the outer terminal when an agent needs you
# and Herdr is in the background. No polling, no daemon.
delivery = "terminal"

[ui.sound]
enabled = true

[worktrees]
# Where C-a C-g (and Herdr's own "New worktree") put checkouts:
# <directory>/<repo>/<branch>. worktree_dir in options.env changes it, for
# tmux as well.
directory = "@@WORKTREE_DIR@@"

[session]
# Claude Code and Codex come back into the same conversation after a server
# restart (needs the integrations: herdr integration install claude codex).
resume_agents_on_restore = true

[experimental]
# Recent pane contents also survive a server restart. Stored beside
# session.json; treat it like shell history.
pane_history = true
